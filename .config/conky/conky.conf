--[[
  Full-screen circuit-board HUD. All drawing happens in hud.lua;
  conky itself only provides a transparent desktop-layer surface.
]]

conky.config = {
    output_backend = 'wayland',

    alignment     = 'top_left',
    gap_x         = 0,
    gap_y         = 0,
    minimum_width  = 1920,
    minimum_height = 1030,   -- screen height minus the bar's reserved space

    own_window_color = '#00000000',   -- fully transparent background

    update_interval = 1,
    double_buffer   = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers      = true,
    format_human_readable = true,
    short_units     = true,

    draw_shades  = false,
    draw_outline = false,
    draw_borders = false,

    lua_load = '~/.config/conky/hud.lua',
    lua_draw_hook_post = 'main',
}

conky.text = [[ ]]
