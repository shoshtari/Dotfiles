# Soft HUD-style lock screen, same palette as conky/waybar:
# leaf orange for accents, steel blue for structure, over the blurred wallpaper.

$orange = rgb(ff9e4a)
$glow   = rgb(ffd29a)
$steel  = rgb(8aa0d8)
$dim    = rgb(6c7698)
$text   = rgb(cdd6f4)
$red    = rgb(f38ba8)

$soft = Comfortaa
$mono = CaskaydiaCove Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 5, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = /home/morteza/Pictures/wallpapers/wallpaperswide.com-autumn-leaves-against-a-twilight-sky-wallpaper-2880x1620.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    contrast = 1.1
    vibrancy = 0.2
}

# ---- header tag ----
label {
    monitor =
    text = locked
    color = $dim
    font_size = 14
    font_family = $soft
    position = 0, 300
    halign = center
    valign = center
}

# ---- clock ----
label {
    monitor =
    text = $TIME
    color = $orange
    font_size = 120
    font_family = Comfortaa Bold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(ff9e4a55)
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $steel
    font_size = 22
    font_family = $soft
    position = 0, 50
    halign = center
    valign = center
}

# thin divider under the date
shape {
    monitor =
    size = 360, 2
    color = rgba(8aa0d855)
    rounding = 0
    position = 0, 20
    halign = center
    valign = center
}

# ---- user ----
label {
    monitor =
    text = 󰀄  $USER
    color = $text
    font_size = 14
    font_family = $mono
    position = 0, -30
    halign = center
    valign = center
}

# ---- password ----
input-field {
    monitor =
    size = 360, 54
    outline_thickness = 2
    rounding = 10

    outer_color = rgba(ff9e4aee) rgba(8aa0d8ee) 45deg
    inner_color = rgba(1e1e2ecc)
    font_color = $glow
    font_family = $mono

    check_color = rgba(ffd29aee) rgba(ff9e4aee) 45deg
    fail_color = $red
    capslock_color = rgba(f9e2afee)

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false

    placeholder_text = <span foreground="##6c7698">password</span>
    fail_text = <span foreground="##f38ba8">wrong password ($ATTEMPTS)</span>

    position = 0, -100
    halign = center
    valign = center
}

# ---- bottom status line ----
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%    󰥔 $(uptime -p | sed 's/^up //')"
    color = $dim
    font_size = 11
    font_family = $mono
    position = -90, 40
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰌌 $LAYOUT
    color = $dim
    font_size = 11
    font_family = $mono
    position = 140, 40
    halign = center
    valign = bottom
}
